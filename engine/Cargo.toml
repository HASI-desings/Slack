[package]
name = "slack-engine"
version = "0.1.0"
edition = "2021"
description = "Copy-trade decision engine: overlap scanner, whale-isolated sell logic, Jito bundle construction."

[dependencies]
tokio = { version = "1", features = ["full"] }        # async runtime for gRPC + Redis + execution loop
tonic = "0.11"                                          # Geyser gRPC client
redis = { version = "0.25", features = ["tokio-comp"] } # internal pub/sub between ingestion/scoring/execution
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-sdk = "2"                                        # tx construction, keypairs
solana-client = "2"                                      # RPC fallback for non-latency-critical reads
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# NOTE: Jito bundle submission uses Jito's searcher gRPC client, not yet
# vendored here — add `jito-searcher-client` once a Jito auth key is
# provisioned; see engine/src/lib.rs module docs for what's stubbed.

[dev-dependencies]
tokio-test = "0.4"
